# Production Nginx Reverse Proxy Configuration for AETHER ENGINEER
# Handles static asset routing, API forwarding, WebSocket/SSE streaming, and security headers.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '\$remote_addr - \$remote_user [\$time_local] "\$request" '
                    '\$status \$body_bytes_sent "\$http_referer" '
                    '"\$http_user_agent" "\$http_x_forwarded_for" '
                    'rt=\$request_time uct="\$upstream_connect_time" uht="\$upstream_header_time" urt="\$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting: 30 requests/second per IP for API
    limit_req_zone \$binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone \$binary_remote_addr zone=conn_limit:10m;

    # Upstream definitions
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 25M;

        # Hardened Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000 ws: wss:;" always;

        # API & Backend Routing
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;

            # Timeouts for LLM and test execution
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Real-Time SSE (Server-Sent Events) Streaming Route
        location /api/v1/events/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            # Disable buffering for live streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;

            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
        }

        # OpenAPI Documentation
        location /docs {
            proxy_pass http://backend_upstream/docs;
            proxy_set_header Host \$host;
        }

        location /openapi.json {
            proxy_pass http://backend_upstream/openapi.json;
            proxy_set_header Host \$host;
        }

        # Prometheus Metrics Endpoint (Internal or Scrape Only)
        location /api/v1/metrics {
            proxy_pass http://backend_upstream/api/v1/metrics;
            proxy_set_header Host \$host;
            # In production, allow only internal monitoring subnets:
            # allow 10.0.0.0/8;
            # deny all;
        }

        # Frontend SPA Static Assets
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        }

        # Healthcheck endpoint
        location /healthz {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}

