name: AETHER ENGINEER CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite (Unit, Integration & Security)
        run: |
          pytest -v backend/tests

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci --prefer-offline

      - name: Frontend TypeScript Typecheck
        working-directory: frontend
        run: |
          npm run build

      - name: Run Frontend Vitest Component Suite
        working-directory: frontend
        run: |
          npm run test

      - name: Verify Recruiter Demonstration Suite
        run: |
          python scripts/run_recruiter_demo.py --scenario all

      - name: Performance & Memory Profile Verification
        run: |
          python scripts/profile_system.py
